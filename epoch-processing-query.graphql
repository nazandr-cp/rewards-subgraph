query GetEpochProcessingData($epochId: ID!) {
  # Main epoch data
  epoch(id: $epochId) {
    id
    epochNumber
    status
    startTimestamp
    endTimestamp
    processingStartedTimestamp
    processingCompletedTimestamp
    totalYieldAvailable
    totalYieldAllocated
    totalYieldDistributed
    remainingYield
    totalSubsidiesDistributed
    totalEligibleUsers
    totalParticipatingCollections
    participantCount
    estimatedProcessingTime
    epochManager {
      id
      currentEpochId
      epochDuration
      processingBuffer
      minimumYieldThreshold
      vault {
        id
        totalShares
        totalDeposits
        totalCTokens
        globalDepositIndex
        totalPrincipalDeposited
        cTokenMarket {
          id
          symbol
          totalSupply
          totalBorrows
          totalReserves
          exchangeRate
          borrowIndex
          collateralFactor
          liquidationIncentive
        }
      }
    }
    vaultAllocations {
      id
      vault {
        id
        totalShares
        totalDeposits
        totalCTokens
        globalDepositIndex
        totalPrincipalDeposited
      }
      yieldAllocated
      subsidiesDistributed
      remainingYield
      participantCount
      averageSubsidyPerUser
      utilizationRate
    }
  }

  # All active collections and their participations
  collections(where: { isActive: true }) {
    id
    contractAddress
    name
    symbol
    isActive
    yieldSharePercentage
    weightFunctionType
    weightFunctionP1
    weightFunctionP2
    minBorrowAmount
    maxBorrowAmount
    totalNFTsDeposited
    totalBorrowVolume
    totalYieldGenerated
    totalSubsidiesReceived
    participations {
      id
      vault {
        id
        totalShares
        totalDeposits
        totalCTokens
        globalDepositIndex
        totalPrincipalDeposited
        cTokenMarket {
          id
          exchangeRate
          borrowIndex
          totalBorrows
          totalSupply
        }
      }
      principalShares
      principalDeposited
      totalCTokens
      globalDepositIndex
      lastGlobalDepositIndex
      yieldAccrued
      yieldClaimed
      totalYieldGenerated
      isBorrowBased
      rewardSharePercentage
      weightFunctionType
      weightFunctionP1
      weightFunctionP2
      secondsAccumulated
      secondsClaimed
      totalSubsidies
      totalSubsidiesClaimed
      averageAPY
      totalParticipants
      accountSubsidies {
        id
        account {
          id
          totalSecondsClaimed
          totalSubsidiesReceived
          totalYieldEarned
          totalBorrowVolume
          totalNFTsOwned
        }
        accountMarket {
          id
          supplyBalance
          borrowBalance
          collateralBalance
          supplyIndex
          borrowIndex
        }
        balanceNFT
        secondsAccumulated
        secondsClaimed
        subsidiesAccrued
        subsidiesClaimed
        averageHoldingPeriod
        totalRewardsEarned
      }
    }
  }

  # All account markets for borrow tracking
  accountMarkets {
    id
    account {
      id
      totalSecondsClaimed
      totalSubsidiesReceived
      totalYieldEarned
      totalBorrowVolume
      totalNFTsOwned
      totalCollectionsParticipated
    }
    cTokenMarket {
      id
      symbol
      exchangeRate
      borrowIndex
      totalBorrows
      totalSupply
      collateralFactor
    }
    supplyBalance
    borrowBalance
    collateralBalance
    supplyIndex
    borrowIndex
    updatedAtBlock
    updatedAtTimestamp
  }

  # System state for global calculations
  systemState(id: "system") {
    id
    activeEpochId
    totalVaults
    totalCollections
    totalUsers
    totalValueLocked
    totalYieldDistributed
    totalSubsidiesDistributed
    systemUtilizationRate
    averageAPY
    lastUpdatedBlock
    lastUpdatedTimestamp
  }

  # Previous epoch for comparison and validation
  epochs(
    where: { epochNumber_lt: $epochNumber }
    orderBy: epochNumber
    orderDirection: desc
    first: 1
  ) {
    id
    epochNumber
    status
    totalYieldDistributed
    totalSubsidiesDistributed
    totalEligibleUsers
    totalParticipatingCollections
    participantCount
    processingTimeMs
    vaultAllocations {
      id
      vault {
        id
      }
      yieldAllocated
      subsidiesDistributed
      remainingYield
    }
  }
}

# Additional query for real-time data during processing
query GetEpochProcessingProgress($epochId: ID!) {
  epoch(id: $epochId) {
    id
    epochNumber
    status
    processingStartedTimestamp
    processingCompletedTimestamp
    totalYieldAllocated
    totalYieldDistributed
    totalSubsidiesDistributed
    participantCount
    processingTimeMs
    processingGasUsed
    processingTransactionCount
    vaultAllocations {
      id
      vault {
        id
      }
      yieldAllocated
      subsidiesDistributed
      remainingYield
      participantCount
      averageSubsidyPerUser
      utilizationRate
    }
    subsidyDistributions {
      id
      user {
        id
      }
      collection {
        id
      }
      vault {
        id
      }
      subsidyAmount
      borrowAmountBefore
      borrowAmountAfter
      nftBalance
      weightedContribution
      gasUsed
      blockNumber
      timestamp
    }
    merkleDistributions {
      id
      vault {
        id
      }
      merkleRoot
      totalAmount
      totalClaims
      blockNumber
      timestamp
    }
  }
}

# Query for historical epoch data and analytics
query GetEpochHistoricalData($limit: Int = 10) {
  epochs(orderBy: epochNumber, orderDirection: desc, first: $limit) {
    id
    epochNumber
    status
    startTimestamp
    endTimestamp
    processingStartedTimestamp
    processingCompletedTimestamp
    totalYieldAvailable
    totalYieldAllocated
    totalYieldDistributed
    remainingYield
    totalSubsidiesDistributed
    totalEligibleUsers
    totalParticipatingCollections
    participantCount
    processingTimeMs
    processingGasUsed
    processingTransactionCount
    vaultAllocations {
      id
      vault {
        id
      }
      yieldAllocated
      subsidiesDistributed
      remainingYield
      participantCount
      averageSubsidyPerUser
      utilizationRate
    }
  }

  dailyMetrics(orderBy: timestamp, orderDirection: desc, first: 30) {
    id
    date
    dailyVolumeUSD
    dailyTransactionCount
    dailyActiveUsers
    dailyYieldDistributed
    dailySubsidiesDistributed
    averageAPY
    utilizationRate
    timestamp
  }
}
