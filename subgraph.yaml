specVersion: 1.2.0
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum
    name: Comptroller
    network: apechain-curtis
    source:
      abi: Comptroller
      address: "0x7E81fAaF1132A17DCc0C76b1280E0C0e598D5635"
      startBlock: 19549350
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CTokenMarket
        - Account
      abis:
        - name: Comptroller
          file: ./abis/Comptroller.json
        - name: cToken
          file: ./abis/cToken.json
      eventHandlers:
        - event: MarketListed(address)
          handler: handleMarketListed
        - event: MarketEntered(address,address)
          handler: handleMarketEntered
      file: ./src/comptroller-mapping.ts
  - kind: ethereum
    name: EpochManager
    network: apechain-curtis
    source:
      abi: EpochManager
      address: "0x871533B1001aF3f5669BD6Af746483831Ee577D2"
      startBlock: 19549350
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Epoch
        - EpochVaultAllocation
        - CollectionsVault
        - Account
      abis:
        - name: EpochManager
          file: ./abis/EpochManager.json
      eventHandlers:
        - event: EpochStarted(indexed uint256,uint256,uint256)
          handler: handleEpochStarted
        - event: EpochFinalized(indexed uint256,uint256,uint256)
          handler: handleEpochFinalized
        - event: VaultYieldAllocated(indexed uint256,indexed address,uint256)
          handler: handleEpochManagerVaultYieldAllocated
        - event: AutomatedSystemUpdated(indexed address)
          handler: handleAutomatedSystemUpdated
        - event: EpochFailed(indexed uint256,string)
          handler: handleEpochFailed
      file: ./src/epoch-manager-mapping.ts
  - kind: ethereum
    name: DebtSubsidizer
    network: apechain-curtis
    source:
      abi: DebtSubsidizer
      address: "0x164EDE04b4fdde2bC8370a94e7cBc874c52553CC"
      startBlock: 19549350
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - SubsidyDistribution
        - Epoch
        - Account
        - Collection
        - CollectionsVault
        - VaultAddition
        - CollectionWhitelist
      abis:
        - name: DebtSubsidizer
          file: ./abis/DebtSubsidizer.json
        - name: cToken
          file: ./abis/cToken.json
      eventHandlers:
        - event: MerkleRootUpdated(indexed address,bytes32,indexed address,uint256)
          handler: handleMerkleRootUpdated
        - event: SubsidyClaimed(indexed address,indexed address,uint256)
          handler: handleSubsidyClaimed
        - event: VaultAdded(indexed address,indexed address,indexed address)
          handler: handleVaultAdded
      file: ./src/debt-subsidizer-mapping.ts
  - kind: ethereum
    name: LendingManager
    network: apechain-curtis
    source:
      abi: LendingManager
      address: "0xe22f9312937792A8C35F0a087475B704a0fB923d"
      startBlock: 19549350
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Account
        - CollectionsVault
        - Collection
        - CollectionParticipation
      abis:
        - name: LendingManager
          file: ./abis/LendingManager.json
      eventHandlers:
        - event: DepositToProtocol(indexed address,uint256)
          handler: handleDepositToProtocol
        - event: WithdrawFromProtocol(indexed address,uint256)
          handler: handleWithdrawFromProtocol
        - event: PrincipalReset(uint256,indexed address)
          handler: handlePrincipalReset
      file: ./src/lending-manager-mapping.ts
  - kind: ethereum
    name: ERC721Collection
    network: apechain-curtis
    source:
      abi: ERC721
      address: "0xc7CfdB8290571cAA6DF7d4693059aB9E853e22EB"
      startBlock: 19549350
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Collection
        - Account
      abis:
        - name: ERC721
          file: ./abis/IERC721.json
        - name: IERC721Metadata
          file: ./abis/IERC721Metadata.json
        - name: cToken
          file: ./abis/cToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
      file: ./src/erc721-mapping.ts
  - kind: ethereum
    name: CollectionRegistry
    network: apechain-curtis
    source:
      abi: CollectionRegistry
      address: "0xC1baC2b6b847176d0546B38f27861AbDEE15ba8c"
      startBlock: 19549350
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CollectionRegistry
        - Collection
        - Account
      abis:
        - name: CollectionRegistry
          file: ./abis/CollectionRegistry.json
      eventHandlers:
        - event: CollectionRegistered(indexed address,uint8,uint8,int256,int256,uint16)
          handler: handleCollectionRegistered
        - event: YieldShareUpdated(indexed address,uint16,uint16)
          handler: handleYieldShareUpdated
        - event: WeightFunctionUpdated(indexed address,uint8,int256,int256)
          handler: handleWeightFunctionUpdated
        - event: VaultAddedToCollection(indexed address,indexed address)
          handler: handleVaultAddedToCollection
        - event: VaultRemovedFromCollection(indexed address,indexed address)
          handler: handleVaultRemovedFromCollection
        - event: CollectionRemoved(indexed address)
          handler: handleCollectionRemoved
        - event: CollectionReactivated(indexed address)
          handler: handleCollectionReactivated
      file: ./src/collection-registry-mapping.ts
templates:
  - kind: ethereum/contract
    name: cToken
    network: apechain-curtis
    source:
      abi: cToken
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/cToken-mapping.ts
      entities:
        - CollectionsVault
        - AccountMarket
        - Collection
        - CollectionParticipation
        - AccountSubsidiesPerCollection
        - Account
        - CTokenMarket
      abis:
        - name: cToken
          file: ./abis/cToken.json
        - name: ERC20
          file: ./abis/ERC20.json
        - name: ERC20SymbolBytes
          file: ./abis/ERC20SymbolBytes.json
        - name: Comptroller
          file: ./abis/Comptroller.json
      eventHandlers:
        - event: AccrueInterest(uint256,uint256,uint256,uint256)
          handler: handleAccrueInterest
        - event: Borrow(address,uint256,uint256,uint256)
          handler: handleBorrow
        - event: LiquidateBorrow(address,address,uint256,address,uint256)
          handler: handleLiquidateBorrow
        - event: Mint(address,uint256,uint256)
          handler: handleMint
        - event: Redeem(address,uint256,uint256)
          handler: handleRedeem
        - event: RepayBorrow(address,address,uint256,uint256,uint256)
          handler: handleRepayBorrow
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
  - kind: ethereum/contract
    name: CollectionVault
    network: apechain-curtis
    source:
      abi: CollectionVault
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Collection
        - CollectionParticipation
        - Account
        - AccountSubsidiesPerCollection
        - CollectionsVault
        - EpochVaultAllocation
        - CollectionYieldAccrual
      abis:
        - name: CollectionVault
          file: ./abis/CollectionsVault.json
        - name: cToken
          file: ./abis/cToken.json
      eventHandlers:
        - event: CollectionDeposit(indexed address,indexed address,indexed
            address,uint256,uint256,uint256)
          handler: handleCollectionDeposit
        - event: CollectionWithdraw(indexed address,indexed address,indexed
            address,uint256,uint256,uint256)
          handler: handleCollectionWithdraw
        - event: VaultYieldAllocatedToEpoch(indexed uint256,uint256)
          handler: handleVaultYieldAllocatedToEpoch
        - event: CollectionYieldAccrued(indexed address,uint256,uint256,uint256,uint256)
          handler: handleCollectionYieldAccrued
        - event: CollectionYieldAppliedForEpoch(indexed uint256,indexed
            address,uint16,uint256,uint256)
          handler: handleCollectionYieldAppliedForEpoch
        - event: YieldBatchRepaid(uint256,indexed address)
          handler: handleYieldBatchRepaid
      file: ./src/collection-vault-mapping.ts
