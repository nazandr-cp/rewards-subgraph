"""
Borrow events from Compound protocol for E2E testing
"""
type Borrow @entity(immutable: true) {
  id: ID!
  borrower: Bytes!
  cToken: Bytes!
  amount: BigInt!
  accountBorrows: BigInt!
  totalBorrows: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}
